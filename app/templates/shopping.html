{% extends 'base.html' %}{% block body %}<main><small>INDKØB</small><h1>Indkøbsliste</h1><form class="add" method="post" action="/shopping/add"><input name="name" placeholder="Tilføj fx mælk" required><button>＋</button></form>{% for i in rows %}<article class="shop {{'done' if i.checked}}"><form method="post" action="/shopping/{{i.id}}/toggle" class="grow"><button class="item"><b>{{i.name}}</b><small>{{i.type or 'Andet'}}{% if i.checked %} · Købt{% endif %}</small></button></form><div class="step"><form method="post" action="/shopping/{{i.id}}/change"><input type="hidden" name="delta" value="-1"><button>−</button></form><strong>{{i.quantity}}</strong><form method="post" action="/shopping/{{i.id}}/change"><input type="hidden" name="delta" value="1"><button>＋</button></form></div><form method="post" action="/shopping/{{i.id}}/delete"><button class="delete">×</button></form></article>{% endfor %}</main>{% endblock %}
