{% extends 'base.html' %}{% block body %}<main><small>INDKØB</small><h1>Indkøbsliste</h1><form class="add" method="post" action="/shopping/add"><input name="name" placeholder="Tilføj vare" required><button>＋</button></form>{% for x in rows %}<article class="shop {{'done' if x.checked}}"><form class="grow" method="post" action="/shopping/{{x.id}}/toggle"><button class="item"><b>{{x.name}}</b><small>{{x.type}}</small></button></form><div><form method="post" action="/shopping/{{x.id}}/minus"><button>−</button></form><strong>{{x.quantity}}</strong><form method="post" action="/shopping/{{x.id}}/plus"><button>＋</button></form></div><form method="post" action="/shopping/{{x.id}}/delete"><button class="danger">×</button></form></article>{% endfor %}</main>{% endblock %}
