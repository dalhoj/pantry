{% extends 'base.html' %}{% block body %}<main><small>INDKØB</small><h1>Indkøbsliste</h1><form class="shopadd" method="post" action="/shopping/add"><input name="name" required placeholder="Tilføj fx mælk"><input name="quantity" type="number" min="1" value="1"><button class="primary compact">＋</button></form>{% for i in rows %}<article class="shoprow {{'done' if i.checked}}"><img src="/static/icons/{{icon_key(i.type or 'Andet')}}.svg"><form method="post" action="/shopping/{{i.id}}/toggle"><button class="check">{{'✓' if i.checked else ''}}</button></form><div class="grow"><b>{{i.name}}</b><span>{{i.type or 'Andet'}}</span><div class="stepper"><form method="post" action="/shopping/{{i.id}}/change"><input type="hidden" name="delta" value="-1"><button>−</button></form><strong>{{i.quantity}}</strong><form method="post" action="/shopping/{{i.id}}/change"><input type="hidden" name="delta" value="1"><button>＋</button></form></div></div><form method="post" action="/shopping/{{i.id}}/delete"><button class="trash">×</button></form></article>{% else %}<div class="empty">Indkøbslisten er tom.</div>{% endfor %}</main>{% endblock %}
