{% extends 'base.html' %}{% block body %}<main><a class="back" href="/scan">‹ SCAN</a><h1>Tilføj manuelt</h1><form class="card editor" method="post"><label>Produkttype<input name="type" required></label><label>Produktnavn<input name="name" required></label><div class="two"><label>Mærke<input name="brand"></label><label>Variant<input name="variant"></label></div><div class="two"><label>Antal<input name="quantity" type="number" min="1" value="1"></label><label>Placering<select name="location">{% for l in locations %}<option>{{l.name}}</option>{% endfor %}</select></label></div><label>Minimum lager<input name="minimum_stock" type="number" min="0" placeholder="Valgfrit"></label><fieldset><legend>Holdbarhed</legend><label class="radio"><input type="radio" name="no_expiry" value="0" checked> Har udløbsdato</label><label class="radio"><input type="radio" name="no_expiry" value="1"> Ingen holdbarhedsdato</label><label id="expiry-wrap">Udløbsdato<input id="expiry" name="expiry" type="date"></label></fieldset><button class="primary wide">Gem på lager</button></form></main>{% endblock %}
