{% extends 'base.html' %}{% block body %}<main><a class="back" href="/scan">‹ SCAN</a><h1>Tilføj manuelt</h1><form class="card" method="post"><label>Produkttype<input name="type" required></label><label>Produktnavn<input name="name" required></label><label>Mærke<input name="brand"></label><label>Variant<input name="variant"></label><label>Antal</label><div class="qty"><button type="button" class="minus">−</button><input class="qtyval" name="quantity" type="number" min="1" value="1" readonly><button type="button" class="plus">＋</button></div><label>Placering<select name="location">{% for l in locations %}<option>{{l.name}}</option>{% endfor %}</select></label><label>Minimum lager<input name="minimum_stock" type="number" min="0" placeholder="Ingen grænse"></label><section class="expiry"><b>HOLDBARHED</b><div class="date-mode"><label>Udløbsdato<input class="expiry-input" name="expiry" type="date" required></label><input class="no-expiry-value" type="hidden" name="no_expiry" value="0"><button type="button" class="expiry-toggle secondary">Ingen holdbarhedsdato</button></div><div class="no-date-mode hidden"><div class="nodate">✓ Ingen holdbarhedsdato</div><button type="button" class="expiry-toggle secondary">Tilføj udløbsdato i stedet</button></div></section><button class="primary wide">Gem på lager</button></form></main>{% endblock %}
