{% extends 'base.html' %}{% block body %}<main><small>MERE · PLACERINGER</small><h1>Administrér placeringer</h1><form class="add" method="post"><input name="name" placeholder="Ny placering" required><button>＋</button></form>{% for l in locations %}<section class="card manage"><form method="post" action="/manage/locations/{{l.id}}/rename"><input name="name" value="{{l.name}}"><button>Gem</button></form><form method="post" action="/manage/locations/{{l.id}}/delete"><select name="target"><option value="">Kun hvis tom</option>{% for t in locations %}{% if t.id!=l.id %}<option value="{{t.name}}">Flyt til {{t.name}}</option>{% endif %}{% endfor %}</select><button class="delete widebtn">Slet</button></form></section>{% endfor %}</main>{% endblock %}
