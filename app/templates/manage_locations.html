{% extends 'base.html' %}{% block body %}<main><small>MERE · PLACERINGER</small><h1>Administrér placeringer</h1><form class="shopadd" method="post"><input name="name" required placeholder="Ny placering"><button class="primary compact">＋</button></form>{% for l in locations %}<article class="manage"><form method="post" action="/manage/locations/{{l.id}}/rename" class="rename"><input name="name" value="{{l.name}}"><button class="primary compact">Gem</button></form><form method="post" action="/manage/locations/{{l.id}}/delete" onsubmit="return confirm('Slet placeringen? Varer flyttes til valgt placering.')"><select name="target"><option value="">Kun hvis tom</option>{% for t in locations %}{% if t.id!=l.id %}<option value="{{t.name}}">Flyt til {{t.name}}</option>{% endif %}{% endfor %}</select><button class="danger compact">Slet</button></form></article>{% endfor %}</main>{% endblock %}
