{% extends 'base.html' %}{% block body %}<main><a class="back" href="/scan">‹ SCAN</a><h1>Scan ind</h1>{% if not barcode %}<div class="scanner"><video id="camera" playsinline muted></video><p id="status">Tryk Start kamera</p></div><button class="cam" data-target="/scan/in?barcode=">Start kamera</button>{% else %}<form class="card editor" method="post" action="/inventory/add"><input type="hidden" name="barcode" value="{{barcode}}"><label>Produkttype<input name="type" value="{{product.type or ''}}" required></label><label>Produktnavn<input name="name" value="{{product.name or ''}}" required></label><label>Mærke<input name="brand" value="{{product.brand or ''}}"></label><label>Variant<input name="variant" value="{{product.variant or ''}}"></label><input type="hidden" name="category" value="{{product.category or ''}}"><label>Antal</label><div class="qty-picker"><button type="button" class="qty-minus">−</button><input class="qty-value" name="quantity" type="number" min="1" value="1" readonly><button type="button" class="qty-plus">＋</button></div><label>Placering<select name="location">{% for l in locations %}<option {{'selected' if product.default_location==l.name}}>{{l.name}}</option>{% endfor %}</select></label><section class="expiry-card"><b>HOLDBARHED</b><div class="date-mode"><label>Udløbsdato<input class="expiry-input" name="expiry" type="date" required></label><input class="no-expiry-value" type="hidden" name="no_expiry" value="0"><button type="button" class="expiry-toggle secondary wide">Ingen holdbarhedsdato</button></div><div class="no-date-mode hidden"><div class="no-date-state">✓ Ingen holdbarhedsdato</div><button type="button" class="expiry-toggle secondary wide">Tilføj udløbsdato i stedet</button></div></section><button class="primary wide">Gem på lager</button></form>{% endif %}</main>{% endblock %}
