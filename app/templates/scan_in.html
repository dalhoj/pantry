{% extends 'base.html' %}{% block body %}<main><a class="back" href="/scan">‹ SCAN</a><h1>Scan ind</h1>{% if not barcode %}<div class="scanner"><video id="camera" playsinline muted></video><p id="status">Tryk Start kamera</p></div><button class="cam" data-target="/scan/in?barcode=">Start kamera</button>{% else %}<form class="card"><p>Stregkode: {{barcode}}</p><p>{{product.name or 'Ukendt produkt'}}</p><label>Antal</label><div class="qty"><button type="button" class="minus">−</button><input class="qtyval" value="1" readonly><button type="button" class="plus">＋</button></div><section class="expiry"><b>HOLDBARHED</b><div class="date-mode"><label>Udløbsdato<input class="expiry-input" type="date"></label><button type="button" class="expiry-toggle secondary">Ingen holdbarhedsdato</button></div><div class="no-date-mode hidden"><div class="nodate">✓ Ingen holdbarhedsdato</div><button type="button" class="expiry-toggle secondary">Tilføj udløbsdato i stedet</button></div></section></form>{% endif %}</main>{% endblock %}
