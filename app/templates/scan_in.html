{% extends 'base.html' %}{% block body %}<main class="narrow"><small>SCAN IND</small><h1>Tilføj vare</h1>{% if not barcode %}<div class="scanner"><video id="camera" playsinline muted></video><div class="scanline"></div><p id="scan-status">Tryk Start kamera</p></div><button type="button" class="primary wide camera-start" data-target="/scan/in?barcode=">Start kamera</button><form class="manual"><input name="barcode" inputmode="numeric" placeholder="Eller skriv stregkoden"><button class="primary compact">Find</button></form>{% else %}<form class="editor" method="post" action="/inventory/add"><input type="hidden" name="barcode" value="{{barcode}}"><div class="found"><span>▥ {{barcode}}</span><h2>{{product.name or 'Ukendt produkt'}}</h2></div><label>Produkttype<input name="type" value="{{product.type or ''}}" required></label><label>Produktnavn<input name="name" value="{{product.name or ''}}" required></label><div class="two"><label>Mærke<input name="brand" value="{{product.brand or ''}}"></label><label>Variant<input name="variant" value="{{product.variant or ''}}"></label></div><input type="hidden" name="category" value="{{product.category or ''}}"><fieldset><legend>Holdbarhed</legend><label class="radio"><input type="radio" name="no_expiry" value="0" {{'checked' if not product.no_expiry_default}}> Har udløbsdato</label><label class="radio"><input type="radio" name="no_expiry" value="1" {{'checked' if product.no_expiry_default}}> Ingen holdbarhedsdato</label><label id="expiry-wrap">Udløbsdato<input name="expiry" id="expiry" type="date"></label></fieldset><div class="two"><label>Placering<select name="location">{% for l in locations %}<option {{'selected' if l.name==product.default_location}}>{{l.name}}</option>{% endfor %}</select></label><label>Antal<input name="quantity" type="number" min="1" value="1"></label></div><button class="primary wide">Gem på lager</button></form>{% endif %}</main>{% endblock %}
