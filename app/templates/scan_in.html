{% extends 'base.html' %}{% block body %}<main><a class="back" href="/scan">‹ SCAN</a><h1>Scan ind</h1>{% if not barcode %}<div class="scanner"><video id="camera" playsinline muted></video><p id="status">Tryk Start kamera</p></div><button class="cam" data-target="/scan/in?barcode=">Start kamera</button>{% else %}<form class="card editor" method="post" action="/inventory/add"><input type="hidden" name="barcode" value="{{barcode}}"><label>Produkttype<input name="type" value="{{product.type or ''}}" required></label><label>Produktnavn<input name="name" value="{{product.name or ''}}" required></label><label>Mærke<input name="brand" value="{{product.brand or ''}}"></label><input type="hidden" name="category" value="{{product.category or ''}}"><label>Antal<input name="quantity" type="number" value="1"></label><label>Placering<select name="location">{% for l in locations %}<option>{{l.name}}</option>{% endfor %}</select></label><label>Udløbsdato<input name="expiry" type="date"></label><input type="hidden" name="no_expiry" value="0"><button class="primary wide">Gem</button></form>{% endif %}</main>{% endblock %}
