<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/static/style.css"><title>Opsæt Pantry</title></head><body class="auth-body">{% with msgs=get_flashed_messages(with_categories=true) %}{% if msgs %}<div id="toast" class="toast">{{msgs[-1][1]}}</div>{% endif %}{% endwith %}<main class="auth-shell"><section class="auth-card"><small>FØRSTE OPSÆTNING</small><h1>Vælg en Pantry-kode</h1><p>Brug 4-12 cifre. Koden gemmes som en sikker hash.</p><form method="post"><label>Ny kode<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" required></label><label>Gentag kode<input name="confirm" type="password" inputmode="numeric" pattern="[0-9]{4,12}" required></label><button class="primary wide">Aktivér beskyttelse</button></form></section></main><script src="/static/app.js"></script></body></html>
