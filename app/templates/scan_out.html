{% extends 'base.html' %}{% block body %}<main><a class="back" href="/scan">‹ SCAN</a><h1>Scan ud</h1>{% if not barcode %}<div class="scanner"><video id="camera" playsinline muted></video><p id="status">Tryk Start kamera</p></div><button class="cam" data-target="/scan/out?barcode=">Start kamera</button>{% elif rows %}{% for x in rows %}<section class="card"><b>{{x.name}}</b><p>{{x.quantity}} stk. · {{x.location}}</p>{% if loop.first %}<form method="post" action="/inventory/use/{{x.id}}/use"><button class="primary wide">Tag i brug</button></form><form method="post" action="/inventory/use/{{x.id}}/discard"><button class="danger wide">Kasser</button></form>{% endif %}</section>{% endfor %}{% else %}<div class="card">Varen findes ikke.</div>{% endif %}</main>{% endblock %}
