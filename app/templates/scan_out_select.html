{% extends 'base.html' %}{% block body %}<main><a class="back" href="/scan">‹ SCAN</a><h1>Vælg vare</h1><form class="inventory-search"><input name="q" value="{{q}}" placeholder="Søg efter vare, type eller placering" autofocus><button class="primary">Søg</button></form>{% for x in items %}<a class="card inventory-pick" href="/scan/out/item/{{x.iid}}"><span><b>{{x.name}}</b><small>{{x.type}} · {{x.location}}{% if x.expiry %} · {{x.expiry[8:10]}}.{{x.expiry[5:7]}}.{{x.expiry[:4]}}{% endif %}</small></span><span class="inventory-pick-right"><strong>{{x.quantity}} stk.</strong><i>›</i></span></a>{% else %}<div class="card">Ingen varer matcher søgningen.</div>{% endfor %}</main>{% endblock %}
