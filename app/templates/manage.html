{% extends 'base.html' %}{% block body %}<main><a class="back" href="/more">‹ MERE</a><h1>Administrér placeringer</h1><form class="shopadd" method="post"><input name="name" required placeholder="Ny placering"><button class="primary compact">＋</button></form><div id="location-sort-list">{% for l in locations %}<article class="manage manage-compact sortable-location" data-location-id="{{l.id}}"><div class="location-drag-row"><button type="button" class="drag-handle" aria-label="Flyt {{l.name}}">☰</button><div class="location-summary"><b>{{l.name}}</b><span>{{l.products}} lagerposter · {{l.units}} enheder</span></div></div><form method="post" action="/manage/locations/{{l.id}}/rename" class="manage-row"><input name="name" value="{{l.name}}"><button class="primary action-button">Gem</button></form><form method="post" action="/manage/locations/{{l.id}}/delete" class="manage-row" onsubmit="return confirm('Slet placeringen? Varer flyttes til valgt placering.')"><select name="target"><option value="">Kun hvis tom</option>{% for t in locations %}{% if t.id!=l.id %}<option value="{{t.name}}">Flyt til {{t.name}}</option>{% endif %}{% endfor %}</select><button class="danger action-button">Slet</button></form></article>{% endfor %}</div><p id="reorder-status" class="reorder-status" aria-live="polite"></p></main>{% endblock %}
