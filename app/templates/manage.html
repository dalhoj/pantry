{% extends 'base.html' %}{% block body %}<main><a class="back" href="/more">‹ MERE</a><h1>Administrér placeringer</h1><form class="add" method="post"><input name="name" placeholder="Ny placering" required><button>＋</button></form>{% for l in locations %}<section class="card manage"><form method="post" action="/manage/locations/{{l.id}}/rename" class="manage-row"><input name="name" value="{{l.name}}"><button class="primary">Gem</button></form><form method="post" action="/manage/locations/{{l.id}}/delete" class="manage-row"><select name="target"><option value="">Slet kun hvis tom</option>{% for t in locations %}{% if t.id!=l.id %}<option value="{{t.name}}">Flyt varer til {{t.name}}</option>{% endif %}{% endfor %}</select><button class="danger">Slet</button></form></section>{% endfor %}</main>{% endblock %}
