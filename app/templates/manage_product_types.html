{% extends 'base.html' %}{% block body %}<main><a class="back" href="/more">‹ MERE</a><h1>Administrér produkttyper</h1><form class="product-type-add" method="post"><input name="name" required placeholder="Ny produkttype"><select name="default_location"><option value="">Ingen standardplacering</option>{% for l in locations %}<option>{{l.name}}</option>{% endfor %}</select><input name="icon_key" value="box" placeholder="Ikon"><button class="primary">＋ Tilføj</button></form><div id="type-sort-list">{% for t in types %}<article class="type-manage sortable-type" data-type-id="{{t.id}}"><div class="type-drag-head"><button type="button" class="type-drag-handle">☰</button><div><b>{{t.name}}</b><span>{{t.products}} produkter{% if t.default_location %} · Standard: {{t.default_location}}{% endif %}</span></div></div><form method="post" action="/manage/product-types/{{t.id}}/update" class="type-edit-grid"><label>Navn<input name="name" value="{{t.name}}"></label><label>Standardplacering<select name="default_location"><option value="">Ingen</option>{% for l in locations %}<option {{'selected' if l.name==t.default_location}}>{{l.name}}</option>{% endfor %}</select></label><label>Ikon<input name="icon_key" value="{{t.icon_key or 'box'}}"></label><button class="primary type-save">Gem</button></form><form method="post" action="/manage/product-types/{{t.id}}/delete" class="type-delete-row" onsubmit="return confirm('Slet produkttypen?')"><select name="target"><option value="">Slet kun hvis ubrugt</option>{% for x in types %}{% if x.id!=t.id %}<option value="{{x.name}}">Flyt produkter til {{x.name}}</option>{% endif %}{% endfor %}</select><button class="danger">Slet</button></form></article>{% endfor %}</div><p id="type-order-status" class="reorder-status" aria-live="polite"></p></main>{% endblock %}
