{% extends 'base.html' %}{% block body %}<main><a class="back" href="{{return_to}}">‹ TILBAGE</a><h1>Redigér lagerpost</h1><form class="card editor" method="post"><input type="hidden" name="return_to" value="{{return_to}}"><label>Produkttype<input name="type" value="{{item.type}}" required></label><label>Produktnavn<input name="name" value="{{item.name}}" required></label><div class="two"><label>Mærke<input name="brand" value="{{item.brand or ''}}"></label><label>Variant<input name="variant" value="{{item.variant or ''}}"></label></div><div class="two"><label>Antal<input name="quantity" type="number" min="0" value="{{item.quantity}}"></label><label>Placering<select name="location">{% for l in locations %}<option {{'selected' if l.name==item.location}}>{{l.name}}</option>{% endfor %}</select></label></div><label>Minimum lager<input name="minimum_stock" type="number" min="0" value="{{item.minimum_stock or ''}}" placeholder="Ingen grænse"></label><fieldset><legend>Holdbarhed</legend><label class="radio"><input type="radio" name="no_expiry" value="0" {{'checked' if item.expiry}}> Har udløbsdato</label><label class="radio"><input type="radio" name="no_expiry" value="1" {{'checked' if not item.expiry}}> Ingen holdbarhedsdato</label><label id="expiry-wrap">Udløbsdato<input id="expiry" name="expiry" type="date" value="{{item.expiry or ''}}"></label></fieldset><button class="primary wide">Gem ændringer</button></form><form method="post" action="/inventory/{{item.iid}}/delete" onsubmit="return confirm('Slet lagerposten?')"><input type="hidden" name="return_to" value="{{return_to}}"><button class="danger wide">Slet lagerpost</button></form></main>{% endblock %}
