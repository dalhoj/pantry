{% extends 'base.html' %}{% block body %}<main><a class="back" href="{{return_to}}">‹ TILBAGE</a><h1>Redigér lagerpost</h1><form class="card editor" method="post"><input type="hidden" name="return_to" value="{{return_to}}"><label>Produkttype<select name="type" required>{% for t in product_types %}<option value="{{t.name}}" {{'selected' if t.name==item.type}}>{{t.name}}</option>{% endfor %}</select></label>{% if suggested_type and suggested_type != item.type and suggested_type != 'Andet' %}<div class="type-suggestion">Foreslået type: <b>{{suggested_type}}</b> <button type="button" class="use-type-suggestion" data-type="{{suggested_type}}">Brug forslag</button></div>{% endif %}<label>Produktnavn<input name="name" value="{{item.name}}" required></label><label>Mærke<input name="brand" value="{{item.brand or ''}}"></label><label>Variant<input name="variant" value="{{item.variant or ''}}"></label><label>Antal<input name="quantity" type="number" min="0" value="{{item.quantity}}"></label><label>Placering<select name="location">{% for l in locations %}<option {{'selected' if l.name==item.location}}>{{l.name}}</option>{% endfor %}</select></label><label>Minimum lager<input name="minimum_stock" type="number" min="0" value="{{item.minimum_stock or ''}}"></label><section class="expiry-card"><b>HOLDBARHED</b><div class="date-mode {{'hidden' if not item.expiry}}"><label>Udløbsdato<input class="expiry-input" name="expiry" type="date" value="{{item.expiry or ''}}" {{'required' if item.expiry}}></label><input class="no-expiry-value" type="hidden" name="no_expiry" value="{{'0' if item.expiry else '1'}}"><button type="button" class="expiry-toggle secondary wide">Ingen holdbarhedsdato</button></div><div class="no-date-mode {{'hidden' if item.expiry}}"><div class="no-date-state">✓ Ingen holdbarhedsdato</div><button type="button" class="expiry-toggle secondary wide">Tilføj udløbsdato i stedet</button></div></section><button class="primary wide">Gem ændringer</button></form><form method="post" action="/inventory/{{item.iid}}/delete"><input type="hidden" name="return_to" value="{{return_to}}"><button class="danger wide">Slet lagerpost</button></form></main>{% endblock %}
