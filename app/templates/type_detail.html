{% extends 'base.html' %}{% block body %}<main><small>PRODUKTTYPE</small><h1>{{name}}</h1>{% for i in rows %}<a class="stockrow" href="/inventory/{{i.iid}}/edit"><img src="/static/icons/{{icon_key(i.type)}}.svg"><div class="grow"><b>{{i.name}}</b><span>{{i.brand}} · {{i.location}}{% if i.expiry %} · {{i.expiry[8:10]}}.{{i.expiry[5:7]}}.{{i.expiry[:4]}}{% endif %}</span></div><strong>{{i.quantity}}</strong></a>{% endfor %}</main>{% endblock %}
