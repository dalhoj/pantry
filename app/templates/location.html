{% extends 'base.html' %}{% block body %}<main><a class="back" href="/locations">‹ PLACERINGER</a><h1>{{name}}</h1><form class="sort"><select name="sort" onchange="this.form.submit()"><option value="name">Navn</option><option value="expiry" {{'selected' if sort=='expiry'}}>Udløbsdato</option><option value="qty_asc" {{'selected' if sort=='qty_asc'}}>Laveste antal</option></select></form>{% for x in rows %}<div class="stock card"><a href="/inventory/{{x.iid}}/edit?return_to=/locations/{{name}}"><b>{{x.name}}</b><small>{{x.type}}{% if x.expiry %} · {{x.expiry[8:10]}}.{{x.expiry[5:7]}}.{{x.expiry[:4]}}{% endif %}</small></a><div class="step"><form method="post" action="/inventory/{{x.iid}}/change"><input type="hidden" name="delta" value="-1"><input type="hidden" name="return_to" value="/locations/{{name}}"><button>−</button></form><strong>{{x.quantity}}</strong><form method="post" action="/inventory/{{x.iid}}/change"><input type="hidden" name="delta" value="1"><input type="hidden" name="return_to" value="/locations/{{name}}"><button>＋</button></form></div></div>{% endfor %}</main>{% endblock %}
