<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/static/style.css"><title>Pantry login</title></head><body class="auth-body">{% with msgs=get_flashed_messages(with_categories=true) %}{% if msgs %}<div id="toast" class="toast">{{msgs[-1][1]}}</div>{% endif %}{% endwith %}<main class="auth-shell"><section class="auth-card"><small>PANTRY</small><h1>Lås Pantry op</h1><p>Indtast din personlige kode.</p><form method="post"><input type="hidden" name="next" value="{{next}}"><label>Kode<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]*" autofocus required></label><label class="remember-row"><input type="checkbox" name="remember" value="1" checked> Husk mig på denne enhed</label><button class="primary wide">Lås op</button></form></section></main><script src="/static/app.js"></script></body></html>
